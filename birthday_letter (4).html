<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Birthday Letter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#180b17;color:#fff;font-family:Georgia,serif}body{display:grid;place-items:center;min-height:100vh;padding:14px;background:radial-gradient(ellipse at center,#4a1937 0%,#210e20 55%,#100811 100%)}
.stage{width:min(100%,900px);position:relative;overflow:hidden;border-radius:8px;box-shadow:0 18px 60px #0009;background:#210e20;aspect-ratio:1.18}
video{position:absolute;width:110%;height:110%;left:-5%;top:-2%;object-fit:cover;object-position:center center;cursor:pointer}
/* The lower crop removes the recording's extra page controls, including the unwanted writing button. */
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 18px #16091455}
.cover{position:absolute;inset:0;display:grid;place-items:center;background:transparent;cursor:pointer;border:0;color:transparent;z-index:2}
.sound{position:absolute;right:12px;top:12px;z-index:4;border:1px solid #e7c6d4a8;background:#2a1025d9;color:#fff;border-radius:999px;padding:9px 12px;font:14px system-ui;cursor:pointer;backdrop-filter:blur(5px)}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;background:#210e20bd;color:#fff0;font-size:1px;pointer-events:none}
@media(max-width:600px){body{padding:0}.stage{width:100vw;border-radius:0}.sound{right:8px;top:8px;padding:8px 10px}}
</style></head><body><main class="stage" aria-label="Birthday letter">
<video id="letterVideo" playsinline preload="auto" muted>
<source src="birthday-video.mp4" type="video/mp4">
</video>
<button class="cover" id="openLetter" aria-label="Open the letter" title="Open the letter"></button>
<button class="sound" id="soundButton" aria-label="Turn sound on">♫ Sound off</button>
</main>
<script>
const video=document.getElementById('letterVideo');const opener=document.getElementById('openLetter');const sound=document.getElementById('soundButton');let started=false;video.currentTime=0;
function openLetter(){if(!started){started=true;opener.style.display='none';video.currentTime=0;video.play().catch(()=>{});}else if(video.paused){video.play().catch(()=>{});} }
opener.addEventListener('click',openLetter);video.addEventListener('click',()=>{if(!started)openLetter();else if(video.paused)video.play();else video.pause();});
sound.addEventListener('click',e=>{e.stopPropagation();video.muted=!video.muted;sound.textContent=video.muted?'♫ Sound off':'♫ Sound on';sound.setAttribute('aria-label',video.muted?'Turn sound on':'Turn sound off');});
video.addEventListener('ended',()=>{started=false;opener.style.display='block';video.currentTime=0;});
</script></body></html>
